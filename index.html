:root{--indigo:#5856d6;--orange:#ff9500;--purple:#af52de;--teal:#30b0c7;--pink:#ff2d55;--r:22px;--sh:0 2px 8px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.08);--glass:rgba(242,242,247,.72)}

.mod:active:not(:disabled){transform:scale(.97)}.mod.wide{grid-column:1/-1;min-height:0}.mod.soon{opacity:.74}

.q{box-shadow:var(--sh);padding:36px 20px}.q h2{font-size:44px;line-height:1.05;letter-spacing:-.022em;margin:10px 0 0}.q small{display:inline-block;padding:3px 10px;border-radius:99px;background:var(--fill);font-size:12px}

.opt{display:flex;align-items:center;gap:12px;box-shadow:var(--sh);transition:background .2s,transform .18s}.opt:active{transform:scale(.985)}
.opt em{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:13px;font-weight:600;background:var(--fill);color:var(--tx2)}.opt.ok em,.opt.bad em{background:rgba(255,255,255,.28);color:#fff}
.opt.bad{animation:shake .32s}@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
#app>*{animation:rise .55s cubic-bezier(.23,1,.32,1) both}#app>:nth-child(2){animation-delay:0.06s}#app>:nth-child(3){animation-delay:0.12s}#app>:nth-child(4){animation-delay:0.18s}#app>:nth-child(5){animation-delay:0.24s}#app>:nth-child(6){animation-delay:0.30s}#app>:nth-child(7){animation-delay:0.36s}#app>:nth-child(8){animation-delay:0.42s}#app>:nth-child(9){animation-delay:0.48s}#app>:nth-child(10){animation-delay:0.54s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
#rg{transition:stroke-dashoffset 1.6s cubic-bezier(.23,1,.32,1)}
.day i{width:100%;transform:scaleX(0);transform-origin:left;transition:transform 1.6s cubic-bezier(.23,1,.32,1)}
.hero:before{animation:glow 10s ease-in-out infinite alternate}@keyframes glow{to{transform:translate(8%,5%) scale(1.15)}}
.mod{transition:transform .15s cubic-bezier(.23,1,.32,1),filter .5s,opacity .5s}.mod.soon.gray{filter:grayscale(1);opacity:.5}
.chip,.primary,.skip{transition:transform .18s,background .2s}.chip:active,.primary:active,.skip:active{transform:scale(.96)}
#app>.opt.bad{animation:shake .45s}#app>.opt.ok{animation:okp .45s}@keyframes okp{50%{transform:scale(1.03)}}
.q h2{animation:rise .5s cubic-bezier(.23,1,.32,1) both .12s}
.toast{animation:tin .35s cubic-bezier(.23,1,.32,1)}@keyframes tin{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}

#tab[hidden]{display:none}#tab button{flex:1;max-width:200px;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:var(--tx2);font-size:11px;padding:4px 0;transition:color .25s,transform .2s}
#tab svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}#tab button.on{color:var(--blue)}#tab button:active{transform:scale(.94)}
.prof{display:flex;align-items:center;gap:16px}.prof h2{margin:0;font-size:22px;letter-spacing:-.02em}.prof small{color:var(--tx2)}

.row2{display:flex;justify-content:space-between;padding:14px 16px;border-bottom:.5px solid var(--sep)}.row2:last-child{border:0}.row2 span{color:var(--tx2)}
/* ===== 液态玻璃 ===== */
:root{--gl:rgba(255,255,255,.58);--gl2:rgba(255,255,255,.72);--spec:inset 0 1px 0 rgba(255,255,255,.75),inset 0 0 0 .5px rgba(255,255,255,.35),0 0 0 .5px rgba(0,0,0,.05);--gsh:0 8px 28px rgba(31,38,135,.10),0 2px 6px rgba(0,0,0,.06);--b1:rgba(10,132,255,.30);--b2:rgba(175,82,222,.24);--b3:rgba(48,176,199,.26)}
@media(prefers-color-scheme:dark){:root{--gl:rgba(38,38,42,.52);--gl2:rgba(44,44,48,.66);--spec:inset 0 1px 0 rgba(255,255,255,.16),inset 0 0 0 .5px rgba(255,255,255,.08),0 0 0 .5px rgba(0,0,0,.5);--gsh:0 10px 30px rgba(0,0,0,.45);--b1:rgba(10,132,255,.34);--b2:rgba(191,90,242,.26);--b3:rgba(64,200,224,.22)}}
#bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
#bg i{position:absolute;width:80vmax;height:80vmax;border-radius:50%;will-change:transform}
#bg i:nth-child(1){background:radial-gradient(circle,var(--b1),transparent 62%);left:-30vmax;top:-30vmax;animation:drift1 26s ease-in-out infinite alternate}
#bg i:nth-child(2){background:radial-gradient(circle,var(--b2),transparent 62%);right:-34vmax;top:18vh;animation:drift2 32s ease-in-out infinite alternate}
#bg i:nth-child(3){background:radial-gradient(circle,var(--b3),transparent 62%);left:-10vmax;bottom:-40vmax;animation:drift3 29s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(22vw,26vh) scale(1.15)}}@keyframes drift2{to{transform:translate(-26vw,22vh) scale(.9)}}@keyframes drift3{to{transform:translate(20vw,-28vh) scale(1.1)}}
.nofx #bg i{animation-play-state:paused}
.card,.list,.mod,.opt,.motto{background:var(--gl);-webkit-backdrop-filter:blur(18px) saturate(180%);backdrop-filter:blur(18px) saturate(180%);box-shadow:var(--spec),var(--gsh)}
.q{background:var(--gl2)}.motto{border-left-color:var(--blue)}
.list button,.row2{border-bottom-color:rgba(127,127,127,.18)}
.mod,.opt,.list button,.primary,.chip,.avatar{position:relative;overflow:hidden;isolation:isolate}
.mod:after,.opt:after,.list button:after,.primary:after,.chip:after,.avatar:after{content:"";position:absolute;left:var(--x,50%);top:var(--y,50%);width:220px;height:220px;margin:-110px 0 0 -110px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.55),rgba(255,255,255,0) 62%);opacity:0;transform:scale(.4);transition:opacity .5s,transform .7s cubic-bezier(.23,1,.32,1);pointer-events:none;mix-blend-mode:soft-light;z-index:1}
.lit:after{opacity:1;transform:scale(1);transition:opacity .18s,transform .45s cubic-bezier(.23,1,.32,1)}
.mod>*,.opt>*{position:relative;z-index:2}
.mod:before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(160deg,rgba(255,255,255,.45),rgba(255,255,255,0) 38%);pointer-events:none;z-index:1}
@media(prefers-color-scheme:dark){.mod:before{background:linear-gradient(160deg,rgba(255,255,255,.10),rgba(255,255,255,0) 38%)}}
.hero:after{content:"";position:absolute;top:-50%;left:-60%;width:40%;height:200%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent);transform:rotate(20deg) translateX(0);animation:sheen 9s ease-in-out infinite;pointer-events:none}
@keyframes sheen{0%,62%{transform:rotate(20deg) translateX(0)}100%{transform:rotate(20deg) translateX(520%)}}
.hero{box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 14px 36px rgba(10,132,255,.30)}
.top{background:var(--gl);box-shadow:inset 0 -.5px 0 rgba(127,127,127,.2);margin:0 -16px 8px;padding:8px 16px}
#tab{left:50%;right:auto;bottom:calc(10px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(360px,calc(100% - 32px));display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;padding:6px;border:0;border-radius:999px;background:var(--gl2);box-shadow:var(--spec),0 10px 30px rgba(0,0,0,.16)}
#tab button{max-width:none;position:relative;z-index:1}
#tab .lens{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/3);border-radius:999px;background:rgba(10,132,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 -1px 2px rgba(10,132,255,.12),0 2px 8px rgba(10,132,255,.18);transition:transform .6s cubic-bezier(.34,1.35,.64,1)}
#tab[data-on=pk] .lens{transform:translateX(100%)}#tab[data-on=me] .lens{transform:translateX(200%)}
#tab .lens{animation:none}#tab[data-on] .lens{animation:wob .6s cubic-bezier(.23,1,.32,1)}
@keyframes wob{40%{border-radius:40% 60% 55% 45%/60% 45% 55% 40%}}
.toast{background:rgba(40,40,44,.72);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 10px 30px rgba(0,0,0,.25);border-radius:999px;padding:10px 18px}
@keyframes rise{from{opacity:0;transform:translateY(12px) scale(.97)}}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.card,.list,.mod,.opt,.motto,#tab,.top{background:var(--card)}}
@media(prefers-reduced-transparency:reduce){#bg{display:none}.card,.list,.mod,.opt,.motto,#tab,.top,.toast{background:var(--card);-webkit-backdrop-filter:none;backdrop-filter:none}.toast{background:#3a3a3c}}
@media(prefers-contrast:more){.card,.list,.mod,.opt,.motto,#tab{box-shadow:0 0 0 1px var(--tx)}}
/* ===== 动画速度（按 apple-design skill 的数值，× 速度系数 --k）===== */
:root{--k:1.5;--eo:cubic-bezier(.23,1,.32,1)}
#app>*{animation:none}
#app.enter>*{animation:rise calc(.4s*var(--k)) var(--eo) both}
#app.enter>:nth-child(2){animation-delay:calc(0.04s*var(--k))}#app.enter>:nth-child(3){animation-delay:calc(0.08s*var(--k))}#app.enter>:nth-child(4){animation-delay:calc(0.12s*var(--k))}#app.enter>:nth-child(5){animation-delay:calc(0.16s*var(--k))}#app.enter>:nth-child(6){animation-delay:calc(0.20s*var(--k))}#app.enter>:nth-child(7){animation-delay:calc(0.24s*var(--k))}#app.enter>:nth-child(8){animation-delay:calc(0.28s*var(--k))}#app.enter>:nth-child(9){animation-delay:calc(0.32s*var(--k))}#app.enter>:nth-child(10){animation-delay:calc(0.36s*var(--k))}
@keyframes fadein{from{opacity:0}}
.q h2{animation:fadein calc(.25s*var(--k)) var(--eo) both}
#rg{transition:stroke-dashoffset calc(.7s*var(--k)) var(--eo)}
.day i{transition:transform calc(.7s*var(--k)) var(--eo)}
.mod,.opt,.chip,.primary,.skip,#tab button{transition:transform calc(.3s*var(--k)) var(--eo),background .2s,filter calc(.4s*var(--k)),opacity calc(.4s*var(--k))}
.mod:active:not(:disabled),.opt:active,.chip:active,.primary:active,.skip:active,#tab button:active{transition-duration:.1s}
#app>.opt.bad{animation:shake calc(.4s*var(--k))}#app>.opt.ok{animation:okp calc(.35s*var(--k))}
#tab .lens{transition:transform calc(.38s*var(--k)) cubic-bezier(.34,1.25,.64,1)}
#tab[data-on] .lens{animation:wob calc(.38s*var(--k)) var(--eo)}
.toast{animation:tin calc(.3s*var(--k)) var(--eo)}

<div class=cmp>${bar(me.wk,sel.wk,'本周学习')}${bar(me.wnw,sel.wnw,'本周新词')}${bar(me.rc,sel.rc,'已背单词')}${bar(me.mk,sel.mk,'已掌握')}${bar(me.streak,sel.streak,'连续打卡')}</div>
<p class=foot style="margin:6px 0 0">${me[RKK]>sel[RKK]?'领先对手 '+(me[RKK]-sel[RKK])+' '+m[1]+'，保持住！':me[RKK]<sel[RKK]?'还差 '+(sel[RKK]-me[RKK])+' '+m[1]+' 就能追上，加油！':'势均力敌，今天多背一点就能领先'}</p></div>`:'';
app.innerHTML=`<h1>PK 榜</h1><div class=chips>${Object.entries(RKM).map(([k,v])=>`<button class="chip${RKK==k?' on':''}" data-a=pks data-k=${k}>${v[0]}</button>`).join('')}</div>${vs}
<div class=thead><b>${m[0]}排行</b><span>${L.length} 位同学 · 匿名显示</span></div><div class=list>${rows||'<p class=foot style="padding:16px">还没有同学的数据</p>'}</div><p class=foot>${m[2]}。名字只显示首尾字，其他同学看不到你的真实姓名</p>`}
function boot(){if(!API&&!DEMO&&!LOCAL)return main();if(S.user&&S.user.token){if(LOCAL&&(!S.user.local||(window.USERS&&USERS.list&&!USERS.list.some(x=>x.i==S.user.local)))){S.user=null;save();return loginView('账号未开通或已停用，请联系老师')}return S.user.must?chgView():main()}loginView()}
persist().then(()=>{if(view=='me')me(1)});
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
$('#tab').addEventListener('click',e=>app.onclick(e));
boot();
</script></body></html>
